<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1243B8">
<meta name="description" content="Spieltags-VLOG: das Handball-Textadventure der 109er">
<title>Spieltags-VLOG</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: schmale Handy-Spalte. Vlog-Kopf mit REC, vier Form-Balken, eine Spielphase pro Bildschirm, Skill-Baum als Liste mit Einrückung. */
:root{
  --bg:#F4F7FD; --surface:#FFFFFF; --ink:#0A1A3F; --muted:#52628A; --line:#D3DCEE;
  --accent:#1243B8; --accent-fg:#FFFFFF; --link:#1243B8; --soft:#E5EDFC;
  --good:#17794D; --warn:#A45F00; --bad:#B02A2A; --rec:#E0312B;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071126; --surface:#0E1B3D; --ink:#EAF0FF; --muted:#94A5CF; --line:#223660;
    --accent:#3463DB; --accent-fg:#FFFFFF; --link:#8DB0FF; --soft:#14285A;
    --good:#4CC38A; --warn:#E8A33D; --bad:#F27A7A; --rec:#FF5A52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071126; --surface:#0E1B3D; --ink:#EAF0FF; --muted:#94A5CF; --line:#223660;
  --accent:#3463DB; --accent-fg:#FFFFFF; --link:#8DB0FF; --soft:#14285A;
  --good:#4CC38A; --warn:#E8A33D; --bad:#F27A7A; --rec:#FF5A52; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.rec{display:inline-flex;gap:7px;align-items:center;color:var(--rec)}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}}
.club{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(46px,14vw,72px);line-height:.92;text-transform:uppercase;color:var(--link);letter-spacing:.01em}
.club small{display:block;font-size:.3em;color:var(--muted);font-weight:700;letter-spacing:.16em;margin-top:8px}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mt{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--soft);border:1px solid var(--line);position:relative;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .5s}
.bar.low b{background:var(--bad)}
.stage{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2,h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.02;text-wrap:balance}
h2{font-size:34px}
h3{font-size:22px;color:var(--link)}
p{margin:0}
.lead{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.note{font-size:14px;color:var(--warn);font-weight:600}
.tip{font-size:14px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1.5px solid var(--line);padding:12px 14px;border-radius:6px;cursor:pointer;min-width:0}
.opt b{font-family:var(--display);font-size:21px;letter-spacing:.03em;text-transform:uppercase;font-weight:800}
.opt span{color:var(--muted);font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid2 .opt{padding:10px 12px}
.grid2 .opt b{font-size:18px}
.btn{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.07em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--link);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:6px 0;text-align:left;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:3px 8px;border-radius:3px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.chip.up{color:var(--good)}
.chip.down{color:var(--bad)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:center}
.setup svg{width:100%;max-width:170px;margin:0 auto;display:block}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=number]{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:10px;border-radius:4px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.pill{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;text-align:left;font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--link)}
.cupwrap{display:flex;align-items:center;gap:16px}
.cup{width:74px;height:84px;border:3px solid var(--ink);border-radius:2px 2px 26px 26px;position:relative;overflow:hidden;flex:none;background:var(--bg)}
.cup i{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.85;transition:height .2s}
.cupnum{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.sweet{position:relative;height:10px;background:var(--soft);border:1px solid var(--line)}
.sweet i{position:absolute;top:0;bottom:0;background:var(--good);opacity:.65}
.cl{display:grid;gap:6px}
.cl div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0;font-weight:500}
.cl .ok{color:var(--good);font-weight:600}
.cl .no{color:var(--bad);font-weight:600}
.lines{display:grid;gap:8px}
.lines p{padding-left:12px;border-left:3px solid var(--line)}
.lines p.bad{border-color:var(--bad)}
.lines p.good{border-color:var(--good)}
.track{position:relative;height:46px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--good);opacity:.4}
.marker{position:absolute;top:0;bottom:0;width:5px;margin-left:-2px;background:var(--ink)}
.fb{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;color:var(--link)}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center}
.board .tm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.board .sc{font-family:var(--display);font-weight:900;font-size:68px;line-height:1;font-variant-numeric:tabular-nums;color:var(--link)}
.clock{text-align:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.1em;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:15px}
.log li{display:grid;grid-template-columns:38px 1fr;gap:8px}
.log .mn{font-family:var(--display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.log .me{font-weight:600;color:var(--link)}
.log .info{color:var(--muted);font-style:italic}
.res{font-family:var(--display);font-weight:900;font-size:clamp(44px,13vw,64px);line-height:.95;text-transform:uppercase}
.res.win{color:var(--good)}
.res.loss{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr auto;gap:0 14px}
.stats>*{padding:8px 0;border-bottom:1px solid var(--line)}
.stats dt{margin:0;font-weight:500}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
.bigr{display:flex;align-items:baseline;gap:10px}
.bigr b{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;color:var(--link);font-variant-numeric:tabular-nums}
.branch{display:flex;flex-direction:column;gap:10px}
.node{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.node.locked{opacity:.55}
.node.maxed{border-color:var(--good)}
.node .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.node .nm{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.pips i.on{background:var(--accent)}
.node .btn{font-size:17px;padding:8px 12px}
:root{--gold:#B8860B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#F2C14E}}
:root[data-theme="dark"]{--gold:#F2C14E}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:center}
.two p{margin:0}
.opp{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.opp h3{font-size:22px}
.mini{border:2px solid var(--accent);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--soft);min-width:0}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.corners .opt{align-items:center;text-align:center;padding:16px 8px}
.corners .opt b{font-size:19px}
.pill:disabled{opacity:.45;cursor:not-allowed}
.clock#bagt{font-size:30px;text-align:right;color:var(--warn)}
.share{width:100%;max-width:440px;margin:0 auto;background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sh-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--link);border-bottom:1px solid var(--line);padding-bottom:8px}
.sh-score{display:flex;flex-direction:column;gap:2px;align-items:center}
.sh-score .res{font-size:clamp(32px,10vw,44px)}
.sh-sc{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:center}
.sh-sc span{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.sh-sc b{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1;font-variant-numeric:tabular-nums;color:var(--link)}
.c{text-align:center}
.sh-me{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--soft);border-radius:6px;padding:10px 12px}
.sh-who{display:flex;flex-direction:column;min-width:0}
.sh-who b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.sh-who span{font-size:13px;color:var(--muted)}
.sh-rate{display:flex;flex-direction:column;align-items:center;line-height:1}
.sh-rate b{font-family:var(--display);font-weight:900;font-size:44px;color:var(--link);font-variant-numeric:tabular-nums}
.sh-rate span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trophy{width:54px;height:54px;flex:none}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cl2{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:4px;padding:6px 4px;text-align:center}
.cl2 b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.cl2 span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sh-vlog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.sh-vlog div{display:flex;flex-direction:column;line-height:1}
.sh-vlog b{font-family:var(--display);font-weight:900;font-size:34px;color:var(--link);font-variant-numeric:tabular-nums}
.sh-vlog span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sh-vlog p{font-size:13px;line-height:1.35;color:var(--muted)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:12px;font-weight:600;padding:3px 8px;border-radius:12px;background:var(--gold);color:var(--bg)}
.sh-foot{text-align:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.achs{display:grid;gap:10px}
.ach{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;opacity:.6}
.ach.got{opacity:1}
.medal{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:22px;color:var(--muted)}
.ach.got .medal{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.at{display:flex;flex-direction:column;gap:3px;min-width:0}
.at b{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em}

.grid2{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

.board .tm{overflow-wrap:normal;word-break:normal;hyphens:manual;font-size:20px}
.sh-sc span{overflow-wrap:normal;hyphens:manual}
.sh-sc span{font-size:17px;max-width:30%;line-height:1.15}
.board .tm{font-size:17px}
.sh-sc{gap:6px}
.sh-sc span{font-size:14px;max-width:none;overflow-wrap:anywhere;letter-spacing:0}
.sh-sc b{font-size:clamp(36px,11vw,50px)}

.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:64px;gap:10px;margin-top:10px}
.tiles .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 8px;line-height:1.2;width:100%;height:100%;margin:0}
.tiles .btn small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}

.ms{margin:14px 0 0;font-size:12px;font-weight:300;opacity:.65;letter-spacing:.01em}
.tiles .btn{font-size:14px;letter-spacing:.03em;hyphens:none;overflow-wrap:normal;word-break:keep-all}

.spd{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.spd .pill{padding:5px 12px;font-size:13px;min-height:0}
.outcome{border-left:4px solid var(--accent,#1244bb);background:rgba(18,68,187,.08);border-radius:8px;padding:10px 12px;margin:8px 0}
.outcome.good{border-left-color:#1a7f4b;background:rgba(26,127,75,.10)}
.outcome.miss{border-left-color:#b45309;background:rgba(180,83,9,.10)}
.outcome b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.outcome p{margin:2px 0;font-size:15px;line-height:1.35}
.board .tm{font-size:15px;min-width:0}

.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.tbl .tn{text-align:left;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.me td{background:var(--soft);font-weight:700}
.tblw{overflow-x:auto;margin:6px 0 12px}
.notes{margin:8px 0;padding-left:18px;font-size:14px;color:var(--muted)}
textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.club.long{font-size:clamp(26px,9vw,38px);line-height:1.05}
.tbl td,.tbl th{white-space:nowrap;padding:5px 3px}
.tbl .tn{max-width:32vw}
.card h2{overflow-wrap:anywhere;hyphens:auto;font-size:clamp(20px,6vw,28px)}

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
var KEY = 'spieltags-vlog-109-v1';

var POS = [
  {id:'KR', name:'Kreisläufer', target:7, share:.13, drain:1.15, pen:.022, assist:.2, tip:'Braucht Kraft: ordentlich frühstücken (Portion 6 bis 8).'},
  {id:'LA', name:'Linksaußen', target:4, share:.11, drain:1.0, pen:.008, assist:.2, wing:1, tip:'Muss schnell sein: lieber leicht essen (Portion 3 bis 5).'},
  {id:'RA', name:'Rechtsaußen', target:4, share:.11, drain:1.0, pen:.008, assist:.2, wing:1, tip:'Muss schnell sein: lieber leicht essen (Portion 3 bis 5).'},
  {id:'RL', name:'Rückraum links', target:5.5, share:.17, drain:1.1, pen:.014, assist:.45, tip:'Wurfkraft und Ausdauer: solide Portion (4,5 bis 6,5).'},
  {id:'RM', name:'Rückraum Mitte', target:5.5, share:.15, drain:1.1, pen:.012, assist:.85, tip:'Spielmacher: Kopf frei, Magen ruhig (4,5 bis 6,5).'},
  {id:'RR', name:'Rückraum rechts', target:5.5, share:.17, drain:1.1, pen:.014, assist:.45, tip:'Wurfkraft und Ausdauer: solide Portion (4,5 bis 6,5).'},
  {id:'TW', name:'Torhüter', target:5, share:0, drain:.6, pen:.002, gk:1, tip:'Reflexe zählen: Fokus ist alles (Portion 4 bis 6).'}
];
function posOf(id){ for (var i=0;i<POS.length;i++) if (POS[i].id===id) return POS[i]; return POS[4]; }

var SK = [
  {id:'kondi', br:'Körper', name:'Kondition', max:3, req:null, d:'+6 Ausdauer je Stufe. Du bleibst länger auf dem Feld.'},
  {id:'kraft', br:'Körper', name:'Wurfkraft', max:3, req:'kondi', d:'+4 Wurfstärke je Stufe, am Kreis noch etwas mehr.'},
  {id:'antritt', br:'Körper', name:'Antritt', max:3, req:'kondi', d:'Mehr Tempo: bessere Würfe von außen, mehr Ballgewinne, schnellere Reflexe im Tor.'},
  {id:'routine', br:'Kopf', name:'Routine', max:2, req:null, d:'Der Kater trifft dich je Stufe 25 % weniger.'},
  {id:'packliste', br:'Kopf', name:'Packliste', max:2, req:'routine', d:'Stufe 1: Checkliste beim Packen. Stufe 2: 2 Plätze mehr in der Tasche.'},
  {id:'ernaehrung', br:'Kopf', name:'Ernährungswissen', max:2, req:'routine', d:'Stufe 1: Werte der Lebensmittel sichtbar. Stufe 2: halbes Bauchweh-Risiko.'},
  {id:'kaffee', br:'Kopf', name:'Barista', max:2, req:'ernaehrung', d:'Zeigt den Sweet Spot beim Kaffee. Stufe 2 macht ihn breiter.'},
  {id:'fans', br:'Team', name:'Fanblock', max:3, req:null, d:'+4 Moral und +2 Teamstärke je Stufe.'},
  {id:'kabine', br:'Team', name:'Kabinenkontakte', max:2, req:'fans', d:'Stufe 1: Du leihst dir Kleinkram und die Hose. Stufe 2: auch Schuhe.'},
  {id:'aufwaermen', br:'Team', name:'Aufwärm-Profi', max:3, req:'fans', d:'Größere Trefferzone und 10 % mehr Bonus je Stufe.'}
];
function skOf(id){ for (var i=0;i<SK.length;i++) if (SK[i].id===id) return SK[i]; }
function depth(s){ return s.req ? 1+depth(skOf(s.req)) : 0; }

var OPP = ['SG Nordkamp','TV Hinterdorf','HC Kellerasseln','Eintracht Mühlbach','SV Zwischenmoor','TuS Fuchsbau','HSV Wiesenhain','Rot-Gelb Pfeffersee'];

var FRIDGE = [

/* ---------- Hilfsfunktionen ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function chance(p){ return Math.random()<p; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(x){ return String(Math.round(x*10)/10).replace('.',','); }

function bump(d){
  var out = [];
  for (var k in d){
    if (!LBL[k] || !d[k]) continue;
    S.m[k] = clamp(S.m[k]+d[k],0,100);
    var v = Math.round(d[k]);
    if (!v) continue;
    out.push('<span class="chip '+(v>0?'up':'down')+'">'+LBL[k]+' '+(v>0?'+':'−')+Math.abs(v)+'</span>');
  }
  return out.length ? '<div class="chips">'+out.join('')+'</div>' : '';
}

  return '<section class="card"><h2>Spiel läuft</h2>'+board(cur.h,cur.a)
    +'<div class="clock" id="mclock">'+(M.state==='done'?'Abpfiff':upto+". Minute")+'</div>'
    +'<ol class="log" id="mlog" aria-live="polite">'+lines+'</ol>'
    +(M.state==='done'
      ?'<button class="btn" data-a="tostats">Abschlussstatistik</button>'
      :'<button class="btn ghost" data-a="skip">Überspringen</button>')+'</section>';
}

var V = {setup:vSetup, evening:vEvening, wake:vWake, coffee:vCoffee, breakfast:vBreak, bag:vBag, travel:vTravel, locker:vLocker, warmup:vWarm, match:vMatch, stats:vStats, skills:vSkills};

    var v = Math.round(S.m[k]); return '<div class="mt">'+LBL[k]+'<div class="bar'+(v<30?' low':'')+'"><b style="width:'+v+'%"></b></div></div>'; }).join('')+'</div>';

var app = document.getElementById('app');

function go(st){
  cancelAnimationFrame(raf); clearInterval(tick);
  S.stage = st;
  if (st==='bag' && !S.bagItems){
    var jn = posOf(S.pos).gk ? 'Torwarttrikot' : 'Trikot (blau)';
    var core = BAG_CORE.map(function(c){ return {id:c.id, n:c.id==='jersey'?jn:c.n, core:1}; });
    S.bagItems = shuffle(core.concat(BAG_OK, shuffle(BAG_ODD).slice(0,6)));
  }
  if (st==='locker' && !S.locker) S.locker = lockerCheck();
  if (st==='warmup' && !S.wu) initWarm();
  if (st==='match' && !S.match) S.match = {state:'ready', i:0};
  render();
  if (st==='warmup' && S.wu && S.wu.running) raf = requestAnimationFrame(wuLoop);
  if (st==='match' && S.match.state==='run') startTick();
  try { window.scrollTo(0,0); } catch(e){}
}

/* ---------- Kabinen-Check ---------- */
function lockerCheck(){
  var has = function(id){ return S.bag.indexOf(id)>=0; };
  var kab = lv('kabine'), F = S.flags, gk = !!posOf(S.pos).gk;
  var core = [], lines = [], d = {energy:0,focus:0,stomach:0,morale:0};
  var add = function(o){ for (var k in o) d[k] = (d[k]||0)+o[k]; };
  var can = true;
  BAG_CORE.forEach(function(c){ core.push({n:(c.id==='jersey'&&gk)?'Torwarttrikot':c.n, ok:has(c.id)}); });
  if (!has('shoes')){
    if (kab>=2){ lines.push({c:'bad',t:'Hallenschuhe vergessen. Der Zeugwart findet ein Paar, eine Nummer zu klein.'}); add({focus:-10,energy:-8,morale:-4}); }
    else { lines.push({c:'bad',t:'Hallenschuhe vergessen. In deiner Größe hat niemand welche. Du kannst nicht spielen.'}); can = false; }
  }
  if (!has('pants')){
    if (kab>=1){ lines.push({c:'bad',t:'Hose vergessen. Ein Mitspieler leiht dir seine Ersatzhose.'}); add({morale:-3}); }
    else if (can && chance(.55)){ lines.push({c:'bad',t:'Hose vergessen. Zum Glück hat jemand eine Ersatzhose dabei.'}); add({morale:-6}); }
    else if (can){ lines.push({c:'bad',t:'Hose vergessen. Niemand hat eine passende. Du kannst nicht spielen.'}); can = false; }
    else lines.push({c:'bad',t:'Hose vergessen.'});
  }
  if (!has('jersey')){
    lines.push({c:'bad',t:'Trikot vergessen. Der Zeugwart gibt dir ein Leibchen mit der Nummer 99.'}); add({morale:-8}); S.num = 99; S.leib = true;
  }
  if (!has('ball')){ if (kab>=1) lines.push({c:'bad',t:'Ball vergessen. Du leihst dir einen aus dem Ballsack.'}); else { lines.push({c:'bad',t:'Ball vergessen. Ohne eigenen Ball fühlst du dich beim Einwerfen unwohl.'}); add({focus:-3}); } }
  if (!has('resin')){
    if (kab>=1) lines.push({c:'bad',t:'Backe vergessen. Ein Kollege gibt dir etwas ab.'});
    else if (gk){ lines.push({c:'bad',t:'Backe vergessen. Im Tor fällt das kaum ins Gewicht.'}); add({focus:-1}); }
    else { lines.push({c:'bad',t:'Backe vergessen. Der Ball rutscht dir aus der Hand.'}); F.atk -= 6; }
  }
  if (!has('tape')){
    if (kab>=1) lines.push({c:'bad',t:'Tape vergessen. Der Physio klebt dir die Finger zu.'});
    else { lines.push({c:'bad',t:'Tape vergessen. Deine Finger sind ungeschützt, das Verletzungsrisiko steigt.'}); F.injury += .06; add({focus:-2}); }
  }
  if (!has('bottle')){ if (kab>=1) lines.push({c:'bad',t:'Trinkflasche vergessen. Du bedienst dich am Becher der Bank.'}); else { lines.push({c:'bad',t:'Trinkflasche vergessen. Du wirst schneller müde.'}); F.drain += .12; } }
  if (!has('towel')){ lines.push({c:'bad',t:'Handtuch vergessen. Du wischst dir die Hände am Trikot ab.'}); add({focus:-2}); }
  if (!has('knee') && !gk){ lines.push({c:'bad',t:'Kniebandage vergessen. Das Knie zwickt schon beim Einlaufen.'}); F.injury += .03; }
  if (!has('shower')){ lines.push({c:'bad',t:'Duschzeug vergessen. Nach dem Spiel gibt es nur Wasser und Hoffnung.'}); add({morale:-2}); }
  if (has('bar')){ lines.push({c:'good',t:'Der Energieriegel in der Tasche gibt dir einen kleinen Schub.'}); add({energy:4}); }
  var odd = 0;
  BAG_ODD.forEach(function(o){
    if (has(o.id)){ odd++; lines.push({c:'',t:o.t}); add(o.d); if (o.luck) F.luck += o.luck; }
  });
  S.oddCount = odd; S.canPlay = can;
  if (!lines.length) lines.push({c:'good',t:'Alles Wichtige ist dabei. Gut gepackt.'});
  var chips = bump(d);
  return {core:core, lines:lines, chips:chips};
}

/* ---------- Aufwärmen ---------- */
function initWarm(){
  var gk = posOf(S.pos).gk;
  var names = ['Einlaufen','Dehnen und Mobilisieren','Passen und Fangen', gk?'Reflexbälle':'Würfe aufs Tor'];
  S.wu = {round:0, total:S.late?2:4, names:names, scores:[], zone:null, p:0, t0:0, speed:1, running:false, fb:'', late:S.late, done:false};
  startRound(true);
}
function startRound(noRender){
  var w = S.wu, sk = lv('aufwaermen'), zw = .16+.05*sk;
  w.zone = {c:rnd(zw/2+.05, 1-zw/2-.05), w:zw};
  w.speed = .75+.2*w.round; w.p = 0; w.fb = ''; w.running = true;
  w.t0 = (typeof performance!=='undefined' ? performance.now() : Date.now());
  if (!noRender){ render(); }
  raf = requestAnimationFrame(wuLoop);
}
function wuLoop(now){
  var w = S.wu; if (!w || !w.running) return;
  var t = (now - w.t0)/1000*w.speed; if (t<0) t = 0;
  var q = t%2; w.p = q<1 ? q : 2-q;
  var m = document.getElementById('marker'); if (m) m.style.left = (w.p*100)+'%';
  raf = requestAnimationFrame(wuLoop);
}
function finishWarm(){
  var w = S.wu, tot = 0; w.scores.forEach(function(s){ tot += s; });
  tot = tot*(1+.1*lv('aufwaermen'));
  w.total_pts = tot; w.chips = bump({energy:tot*.35, focus:tot*.35, morale:tot*.2}); w.done = true;
  render();
}

/* ---------- Spielsimulation ---------- */
function goalTxt(pos){
  if (pos.gk) return '';
  if (pos.wing) return pick(['Tor von außen, aus spitzem Winkel.','Tor über die Außenbahn, der Ball schlägt im Winkel ein.','Tempogegenstoß, Tor über außen.']);
  if (pos.id==='KR') return pick(['Tor am Kreis, gegen zwei Abwehrspieler durchgesetzt.','Anspiel an den Kreis, Drehung, Tor.']);
  return pick(['Tor aus dem Rückraum, ein Hammer.','Tor nach Sprungwurf, unhaltbar.','Durchbruch, Tor.']);
}
function simulate(){
  var pos = posOf(S.pos), gk = !!pos.gk, m = S.m, F = S.flags;
  var kon = lv('kondi'), kr = lv('kraft'), an = lv('antritt'), fa = lv('fans');
  var form = formValue();
  var shoot0 = form+4*kr+(pos.id==='KR'?2*kr:0)+(pos.wing?5:3)*an+F.atk;
  var keep0 = form+2*kon+2*an;
  var homeBase = S.homeBase+fa*2+1.5, oppBase = S.oppBase;
  var canPlay = S.canPlay;
  var stam = Math.min(110, 40+m.energy*.6+6*kon);
  var onCourt = canPlay && (gk || m.energy>=30), susp = 0, out = false;
  var R = {min:0,goals:0,shots:0,sev:0,sevG:0,ast:0,stl:0,pen:0,red:false,inj:false,saves:0,gShots:0,conc:0,sevF:0,sevS:0,log:[],tl:[],half:[0,0]};
  var hs = 0, as = 0, dayH = rnd(-3,3), dayO = rnd(-3,3);
  var nm = '#'+S.num;
  var pre = [];
  if (!canPlay) pre.push({m:0,t:'Du siehst das Spiel von der Bank, in Straßenschuhen und Trainingsjacke.',k:'info'});
  else if (!onCourt) pre.push({m:0,t:'Der Trainer lässt dich wegen niedriger Energie zunächst draußen.',k:'info'});
  else pre.push({m:0,t:'Anpfiff. Du startest als '+nm+'.',k:'info'});
  for (var min=1; min<=60; min++){
    var cur = (min===1 ? pre.slice() : []);
    var lg = function(t,k){ var e = {m:min,t:t,k:k||'me'}; cur.push(e); };
    if (min>1 && min%15===1){ dayH = clamp(dayH*.5+rnd(-3,3),-5,5); dayO = clamp(dayO*.5+rnd(-3,3),-5,5); }
    var wasSusp = susp>0;
    var playing = canPlay && onCourt && !out && !wasSusp;
    if (susp>0) susp--;
    var shoot = shoot0-Math.max(0,35-stam)*.6, keep = keep0-Math.max(0,20-stam)*.4;
    var hAtk = homeBase+dayH+(playing&&!gk?(shoot-60)*.18:0)-(wasSusp?4:0);
    var hDef = homeBase+dayH*.5+(playing?(gk?(keep-60)*.35:(form-60)*.1):0)-(wasSusp?4:0);
    var oAtk = oppBase+dayO, oDef = oppBase+dayO*.5;
    var p;
    // Siebenmeter
    if (chance(.055)){
      if (chance(.5)){
        var tk = playing && !gk && ['RR','RM','LA','RA','RL'].indexOf(pos.id)>=0 && chance(.5);
        if (tk){
          R.sev++; R.shots++; p = clamp(.74+(shoot-60)/300,.5,.9);
          if (chance(p)){ R.sevG++; R.goals++; hs++; lg('7-Meter verwandelt, '+nm+' bleibt eiskalt.'); }
          else lg('7-Meter vergeben. Der Torwart ahnt die Ecke.');
        } else if (chance(.76)) hs++;
      } else {
        if (playing && gk){
          R.sevF++; R.gShots++; p = clamp(.76-(keep-60)/300,.55,.9);
          if (chance(p)){ as++; R.conc++; lg('7-Meter drin. Du warst in der Ecke, aber knapp zu spät.'); }
          else { R.sevS++; R.saves++; lg('7-Meter gehalten! Die Halle tobt.'); }
        } else if (chance(.76)) as++;
      }
    }
    // Angriff Heim
    if (chance(.97) && !chance(.08)){
      var fin = playing && !gk && chance(pos.share/.92);
      if (fin){
        R.shots++; p = clamp(.5+(shoot-60)/150+(hAtk-oDef)/400+F.luck,.25,.8);
        if (chance(p)){ R.goals++; hs++; if (R.goals<=4 || chance(.3)) lg(goalTxt(pos)); }
        else if (chance(.4)) lg('Wurf geblockt, der Ball springt zurück.');
      } else {
        p = clamp(.51+(hAtk-oDef)/200,.3,.72);
        if (chance(p)){ hs++; if (playing && !gk && chance(pos.assist*.2)){ R.ast++; lg('Assist: Dein Pass bringt das Tor.'); } }
      }
    }
    // Angriff Gegner
    if (chance(.97)){
      if (chance(.08)){
        if (playing && !gk && chance(.3*(1+.1*an))){ R.stl++; lg('Ballgewinn! Du fängst den Pass ab.'); }
      } else {
        p = clamp(.51+(oAtk-hDef)/200,.3,.72);
        if (playing && gk){
          R.gShots++;
          if (chance(p)){ as++; R.conc++; }
          else if (chance(.66)){ R.saves++; if (R.saves%4===0) lg('Parade! Das war Parade Nummer '+R.saves+'.'); }
        } else if (chance(p)) as++;
      }
    }
    // Strafen und Verletzungen
    if (playing && !gk && chance(pos.pen*(stam<35?1.8:1))){
      R.pen++; susp = 2;
      if (R.pen>=3){ out = true; R.red = true; lg('Dritte Zeitstrafe: Rote Karte. Dein Spiel ist vorbei.'); }
      else lg('Zwei Minuten! Du musst raus.');
    }
    if (playing && !out && chance(F.injury/60*(stam<30?1.6:1))){
      out = true; R.inj = true; lg('Verletzung. Du humpelst vom Feld.');
    }
    // Ausdauer
    if (playing){
      R.min++; stam -= pos.drain*1.55*(1+F.drain);
      if (!out && stam<(gk?5:24)){ onCourt = false; lg('Auswechslung: Du brauchst eine Pause.','info'); }
    } else if (canPlay && !out && wasSusp){ stam += 1.2; }
    else if (canPlay && !out && !onCourt){ stam += 2.6; if (stam>50){ onCourt = true; lg('Du kommst wieder aufs Feld.','info'); } }
    if (min===30){
      R.half = [hs,as]; stam = Math.min(110, stam+15);
      if (S.bag.indexOf('bar')>=0) stam = Math.min(110, stam+6);
      cur.push({m:30,t:'Halbzeit: '+hs+':'+as,k:'info'});
    } else if (min%10===0 && min<60) cur.push({m:min,t:'Zwischenstand '+hs+':'+as,k:'info'});
    if (min===60) cur.push({m:60,t:'Schlusspfiff: '+hs+':'+as,k:'info'});
    R.tl.push({m:min,h:hs,a:as,ev:cur});
    cur.forEach(function(e){ R.log.push(e); });
  }
  R.hs = hs; R.as = as;
  R.res = hs>as?'win':hs<as?'loss':'draw';
  var rt = 0;
  if (!canPlay) rt = 0;
  else if (gk){
    var sp = R.gShots ? R.saves/R.gShots : .3;
    rt = 5+(sp-.3)*9+R.sevS*.4+(R.res==='win'?.4:R.res==='draw'?.1:-.2)+(R.min/60)*.4-(R.min<20?.5:0);
  } else {
    rt = 5+R.goals*.3-(R.shots-R.goals)*.12+R.ast*.25+R.stl*.15-R.pen*.4+(R.res==='win'?.4:R.res==='draw'?.1:-.2)+(R.min/60)*.5-(R.red?1.2:0);
  }
  R.rating = canPlay ? Math.round(clamp(rt,1,10)*10)/10 : 0;
  return R;
}

/* ---------- Ticker ---------- */
function paint(t){
  var a = document.getElementById('sh'), b = document.getElementById('sa'), c = document.getElementById('mclock'), l = document.getElementById('mlog');
  if (a) a.textContent = t.h; if (b) b.textContent = t.a; if (c) c.textContent = t.m+'. Minute';
  if (l){ t.ev.forEach(function(e){ l.insertAdjacentHTML('beforeend', logLi(e)); }); l.scrollTop = l.scrollHeight; }
}
function step(){
  var M = S.match, R = S.result;
  if (M.i>=60){ clearInterval(tick); M.state = 'done'; render(); return; }
  var t = R.tl[M.i]; M.i++; paint(t);
}

/* ---------- Abschluss ---------- */
function finishRun(){
  if (S.saved) return;
  var R = S.result, gk = !!posOf(S.pos).gk;
  var gain = 1+(R.res==='win'?1:0)+(R.rating>=7.5?1:0)+((R.goals>=8||R.saves>=14)?1:0);
  var views = Math.round(250+R.goals*80+R.saves*40+(R.res==='win'?350:0)+R.rating*60+S.oddCount*120+(S.leib?200:0));
  var cm;
  if (!S.canPlay) cm = 'Der Vlog heißt jetzt "Vergessen ist menschlich". Die Kommentare sind gnadenlos.';
  else if (R.red) cm = 'Die dritte Zeitstrafe ist die beliebteste Szene im Vlog.';
  else if (R.inj) cm = 'Die Fans wünschen gute Besserung, der Vlog bekommt Mitleids-Likes.';
  else if (gk && R.saves>=12) cm = 'Die Kommentare: "Wand!" und "Den hält auch der Hallensprecher."';
  else if (R.goals>=8) cm = 'Der Vlog ist durch die Decke gegangen. Jemand hat eine Fanseite für die '+S.num+' gegründet.';
  else if (R.res==='win') cm = 'Sieg im Heimspiel, der Vlog endet mit der Humba in der Kabine.';
  else if (R.res==='loss') cm = 'Niederlage. Der Vlog endet leise, aber ehrlich.';
  else cm = 'Unentschieden. Beide Fanblöcke singen trotzdem.';
  S.saved = {gain:gain, views:views, comment:cm};
  P.sp += gain; P.career.games++; if (R.res==='win') P.career.wins++; P.career.goals += R.goals; P.career.saves += R.saves;
  saveP();
}

/* ---------- Aktionen ---------- */
var A = {
  pos:function(el){ S.pos = el.dataset.v; render(); },
  start:function(){ S.num = clamp(parseInt(S.num,10)||9,1,99); P.last = {pos:S.pos,num:S.num,name:S.name}; saveP(); go('evening'); },
  go:function(el){ go(el.dataset.v); },
  skills:function(){ S.back = S.stage; go('skills'); },
  back:function(){ S.cr = false; go(S.back||'setup'); },
  learn:function(el){
    var s = skOf(el.dataset.v), l = lv(s.id), cost = l+1;

function eatMeal(items){
  var p = posOf(S.pos), k = 0, e = 0, f = 0, r = 0;
  items.forEach(function(it){ k += it.k; e += it.e; f += it.f; r += it.r; });
  var fit = k-p.target, d = {energy:Math.min(25,e), focus:f}, notes = [];
  if (!items.length){ d.energy = -12; notes.push({c:'bad',t:'Leerer Magen. Das rächt sich in der Halle.'}); }
  else if (fit<-1){
    d.energy -= (-fit-1)*(S.pos==='KR'?7:4.5);
    notes.push({c:'bad',t:S.pos==='KR'?'Für einen Kreisläufer war das zu wenig. Die Kraft fehlt.':'Etwas wenig im Bauch. Das gibt später Löcher.'});
  } else if (fit>1.2){
    d.energy -= (fit-1.2)*(p.wing?8:4);
    notes.push({c:'bad',t:p.wing?'Zu schwer für einen Außen. Du fühlst dich langsam.':'Ein ordentlicher Schlag im Magen. Das drückt.'});
  } else notes.push({c:'good',t:'Genau die richtige Portion für deine Position.'});
  var risk = r+(fit>1.5?(fit-1.5)*12:0); if (lv('ernaehrung')>=2) risk *= .5;
  if (items.length && chance(risk/100)){ d.stomach = -ri(30,45); notes.push({c:'bad',t:'Der Magen grummelt: Bauchschmerzen. Das Spiel geht trotzdem weiter.'}); }
  else if (items.length && S.m.stomach>=70) notes.push({c:'good',t:'Der Magen ist ruhig.'});
  else if (items.length) notes.push({c:'bad',t:'Das Essen ist in Ordnung, aber der Magen grummelt noch.'});
  if (items.length && e>=18 && !d.stomach && S.m.stomach>=50) notes.push({c:'good',t:'Das gibt einen ordentlichen Boost.'});
  S.bf.res = {k:k, notes:notes, chips:bump(d)};
  render();
}

function pick3(pool, key, ok){
  var rec = (P.recent && P.recent[key]) || [];
  var list = pool.filter(function(e){ return (!ok || ok(e)) && !(e.rare && !chance(.06)); });
  var fresh = list.filter(function(e){ return rec.indexOf(e.id)<0; });
  var out = shuffle(fresh.length>=3 ? fresh : list).slice(0,3);
  if (!P.recent) P.recent = {eve:[],day:[],story:[]};

  var idx = 0; K.o.forEach(function(x,i){ if (c && x[0]===c.id) idx = i; });
  var sk = K.o[idx][3], pp;
  pp = K.base+(sm.form-60)/300+.02*ef('nerven')-(sm.oo.exp?.03:0)+sm.cbonus+.05+.05*ef(sk===  'gtech'?'gtech':sk)+(idx===truth?.13:-.02)+.03*ef('spagat');
  sm.cbonus = 0; sm.skipO = true; R.crN++;
  R.gShots++;
  if (chance(clamp(pp,.08,.88))){
    R.saves++; R.crG++; R.lastKey = sm.min; sm.lastSave = sm.min; sLog(sm,'Crunch Time: '+svText(sit==='tempo'?'tempo':sit));
    if (chance(.22+.15*ef('lpass'))){ sm.hs++; sLog(sm,'Langer Pass nach vorn, Konter, Tor!'); }
  } else { R.conc++; sm.as++; sLog(sm,'Crunch Time: '+cnText(sit),'info'); }
}

function playOptions(sm){
  var late = sm.min>=54, el = PLAYS_ALL.filter(function(x){ return (!x.kempa || ef('pass')>=3) && (!x.late || late); });
  var good = el.filter(function(x){ return x.good.indexOf(sm.defSys)>=0 && !x.kempa && !x.late; });
  var bad = el.filter(function(x){ return x.good.indexOf(sm.defSys)<0 && !x.kempa && !x.late; });
  var out = [pick(good)];
  bad = shuffle(bad);
  out.push(bad[0]); out.push(bad[1]);
  var sp = el.filter(function(x){ return x.kempa || x.late; });
  if (sp.length && chance(.45)) out[ri(1,2)] = pick(sp);
  return shuffle(out);
}
function timeoutPlay(sm, id){
  var pl = playOf(id), good = pl.good.indexOf(sm.defSys)>=0, sk = ef('spielzuege'), ok, m = S.m;
  sm.to[sm.min<30?0:1] = true;
  if (pl.kempa){
    ok = chance(.5+.06*ef('pass')+.04*sk);
    if (ok){ sm.boost = {v:9, until:sm.min+10}; sm.cbonus = .12; S.vb += 500; m.morale = clamp(m.morale+6,0,100); sm.pendTxt = 'Kempa! Der Ball fliegt, der Kreisläufer fängt in der Luft und versenkt. Die Halle steht Kopf.'; }
    else { sm.boost = {v:-2, until:sm.min+5}; m.morale = clamp(m.morale-4,0,100); sm.pendTxt = 'Der Kempa-Trick geht schief. Der Ball landet im Aus, die Abwehr lacht nicht, sondern kontert.'; }
    sm.forceCrunch = true; return ok;
  }
  sm.rbOpt = false;
  if (pl.weak) ok = chance(.6);
  else if (pl.late) ok = chance(.55+.05*sk);
  else ok = chance(good ? .8+.05*sk : .3);
  if (ok){ sm.boost = {v:good||pl.late?7:3, until:sm.min+8}; sm.cbonus = .07; sm.pendTxt = pl.n+' sitzt'+(good?': Gegen die '+sm.defSys+'-Abwehr entsteht eine freie Lücke.':'.'); }
  else { sm.boost = {v:-1, until:sm.min+5}; sm.cbonus = 0; sm.pendTxt = pl.n+' läuft ins Leere: Die Abwehr steht '+sm.defSys+' und lässt euch laufen.'; }
  m.morale = clamp(m.morale+(ok?4:-2),0,100);
  sm.forceCrunch = true;
  if (ok && pl.id==='langaussen' && WINGP.indexOf(sm.pos.id)>=0){ sm.rbOpt = true; sm.pendTxt += ' Du darfst aus dem Rückraum abschließen.'; }
  return ok;
}

/* Eine Minute abschließen (reguläre Angriffe, Strafen, Ausdauer) */
function sFinish(sm){
  var min = sm.min, R = sm.R, F = sm.F, pos = sm.pos, gk = sm.gk, playing = sm.playing, wasSusp = sm.wasSusp, oo = sm.oo, p;
  var an = ef('antritt');
  var shoot = sm.shoot0-Math.max(0,35-sm.stam)*.6, keep = sm.keep0-Math.max(0,20-sm.stam)*.4;
  var bst = (sm.boost && min<=sm.boost.until) ? sm.boost.v : 0;
  var hAtk = sm.homeBase+sm.dayH+bst-F.passPen+(playing&&!gk?(shoot-60)*.18:0)-(wasSusp?4:0);
  var hDef = sm.homeBase+sm.dayH*.5+(playing?(gk?(keep-60)*.22:(sm.form-60)*.1):0)-(wasSusp?4:0);
  var oAtk = sm.oppBase+sm.dayO+(oo.fast?2:0)-(min<=sm.manUntil?4:0)+FORMS[sm.myDef].atk(oo), oDef = sm.oppBase+sm.dayO*.5+(oo.tact?2:0);
  if (!sm.skipH && chance(.83)){
    var fin = playing && !gk && !sm.noFin && chance(pos.share*.85*(sm.role==='abw'?.3:sm.role==='ang'?1.4:1)/.92);
    if (fin){
      R.shots++; p = clamp(.47+(shoot-60)/170+(hAtk-oDef)/400+F.luck-Math.max(0,R.goals-4)*.05,.22,.72);
      if (chance(p)){ R.goals++; sm.hs++; R.lastKey = min; if (chance(.8)) sLog(sm,goalTxt(pos)); }
      else if (chance(.6)) sLog(sm, pick(ML_F), 'info');
    } else {
      p = clamp(.51+(hAtk-oDef)/200,.3,.72);
      if (chance(p)){ sm.hs++; if (playing && !gk && chance(pos.assist*.2*(1+.15*ef('pass')))){ R.ast++; sLog(sm, assistTxt(pos)); } }
      else if (playing && !gk && !sm.skipO && chance(.1)){ sLog(sm, pick(TO_F), 'info'); sm.skipO = true; if (chance(.6)) sm.as++; }
    }
  }
  if (!sm.skipO && chance(FORMS[sm.myDef].steal)){
    sm.skipO = true;
    if (chance(.4)) sLog(sm, 'Die Abwehr ('+FORMS[sm.myDef].n+') fängt den Pass ab.', 'info');
    if (chance(.45)){ sm.hs++; sLog(sm,'Tempogegenstoß, Tor!','info'); }
  }
  if (!sm.skipO && chance(.9)){
    if (chance(.08)){
      if (playing && !gk && chance(.3*(1+.1*an+.12*ef('haerte')))){ R.stl++; sLog(sm,'Ballgewinn! Du fängst den Pass ab.'); }
    } else {
      p = clamp(.51+(oAtk-hDef)/200,.3,.72);
      if (playing && gk){
        if (chance(p)){ R.gShots++; sm.as++; R.conc++; if (chance(.45)) sLog(sm, cnText(shotType()), 'info'); }
        else if (chance(.47-.015*ef("stellung"))){
          R.gShots++; R.saves++; R.lastKey = min;
          if (sm.lastSave===min-1 && sm.dpN<2 && chance(.2)){ sm.dpN++; R.dpar = true; sLog(sm,'Parade! Der Abpraller kommt zurück und du hältst auch den! Doppelparade!'); }
          else if (chance(.008)) sLog(sm, SV_RARE);
          else if (chance(.45)) sLog(sm, svText(shotType()));
          sm.lastSave = min;
          if (ef('lpass')>0 && chance(.12*ef('lpass'))){ sm.hs++; sLog(sm,'Langer Pass nach der Parade: Tempogegenstoß, Tor!'); }
        }
      } else if (chance(p)) sm.as++;
    }
  }
  if (playing && !gk && chance((pos.pen+(oo.rival?.004:0)+F.pen+(pos.id==='KR'?.004*ef('haerte'):0))*(sm.stam<35?1.8:1))){
    R.pen++; sm.susp = 2;
    if (R.pen>=3){ sm.out = true; R.red = true; sLog(sm,'Dritte Zeitstrafe: Rote Karte. Dein Spiel ist vorbei.'); }
    else sLog(sm,'Zwei Minuten! Du musst raus.');
  }
  if (playing && !sm.out && chance(F.injury/60*(sm.stam<30?1.6:1))){ sm.out = true; R.inj = true; sLog(sm,'Verletzung. Du humpelst vom Feld.'); }
  if (playing){
    R.min++; sm.stam -= pos.drain*1.55*(1+F.drain);
    if (!sm.out && sm.stam<(gk?5:24)){ sm.onCourt = false; sLog(sm,'Auswechslung: Du brauchst eine Pause.','info'); }
  } else if (sm.canPlay && !sm.out && wasSusp){ sm.stam += 1.2; }
  else if (sm.canPlay && !sm.out && !sm.onCourt){
    sm.stam += 2.6;
    if (sm.benchT>0){ sm.benchT--; if (sm.benchT===0){ sm.onCourt = true; sLog(sm,'Du darfst wieder aufs Feld.','info'); } }
    else if (sm.stam>50){ sm.onCourt = true; sLog(sm,'Du kommst wieder aufs Feld.','info'); }
  }
  if (min===30){
    R.half = [sm.hs,sm.as]; sm.stam = Math.min(110, sm.stam+15);
    if (S.bag.indexOf('bar')>=0) sm.stam = Math.min(110, sm.stam+6);
    sm.cur.push({m:30,t:'Halbzeit: '+sm.hs+':'+sm.as,k:'info'});
  } else if (min%10===0 && min<60) sm.cur.push({m:min,t:'Zwischenstand '+sm.hs+':'+sm.as,k:'info'});
  if (min===60) sm.cur.push({m:60,t:'Schlusspfiff: '+sm.hs+':'+sm.as,k:'info'});
  sm.maxDef = Math.max(sm.maxDef, sm.as-sm.hs);
  R.tl.push({m:min,h:sm.hs,a:sm.as,ev:sm.cur});
  sm.cur.forEach(function(e){ R.log.push(e); });
}

function endSim(sm){
  var R = sm.R, gk = sm.gk;
  R.hs = sm.hs; R.as = sm.as; R.maxDef = sm.maxDef;
  R.res = R.hs>R.as?'win':R.hs<R.as?'loss':'draw';
  var rt = 0;
  if (!sm.canPlay) rt = 0;
  else if (gk){
    var sp = R.gShots ? R.saves/R.gShots : .3;
    rt = 4.5+(sp-.3)*14+R.sevS*.5+R.crG*.2+(R.res==='win'?.4:R.res==='draw'?.1:-.2)+(R.min/60)*.4-(R.min<20?.5:0);
  } else {
    rt = 4.9+R.goals*.28-(R.shots-R.goals)*.14+R.ast*.2+R.stl*.15-R.pen*.4+R.crG*.15+(R.res==='win'?.4:R.res==='draw'?.1:-.2)+(R.min/60)*.5-(R.red?1.2:0);
  }
  R.rating = sm.canPlay ? Math.round(clamp(rt,1,10)*10)/10 : 0;
  R.gw = R.res==='win' && R.hs-R.as===1 && R.lastKey>=57;
  R.cb = R.res==='win' && R.maxDef>=5;
  R.mvp = sm.canPlay && R.res==='win' && R.rating>=9;
  return R;
}
function simulate(){
  var sm = mkSim(false);
  while (sm.min<60) simStep(sm);
  return endSim(sm);
}

function halfApply(sm, d, extra){
  var dF = .36*(d.energy||0)+.26*(d.focus||0)+.2*(d.morale||0);
  sm.form = clamp(sm.form+dF, 20, 100);
  if (d.energy) sm.stam = Math.min(110, sm.stam+d.energy*.8);
  var chips = bump(d);
  return (extra||'')+chips;
}

function makeHalf(sm){
  var R = sm.R, little = R.min<=18 || sm.exited || !sm.onCourt;

  if (!little) h.opts = pickHalf(HALF_LOCKER, 'halfk');

function pickHalf(pool, key){

      +'<button class="opt" data-a="halfgo" data-v="locker"><b>Mit in die Kabine gehen.</b></button></div></div>';
  }

    return head+'<p>'+(h.stage==='hall' ? (h.alone ? 'Deine Mitspieler sind alle in der Kabine. Du hast die Halle für dich.' : 'Ein paar Mitspieler sind noch in der Halle. Was macht ihr?') : 'Pause in der Kabine. Was machst du?')+'</p>'+sum+'<div class="opts">'

}

function blankRec(t){ t.w = 0; t.d = 0; t.l = 0; t.gf = 0; t.ga = 0; t.pts = 0; t.pl = 0; return t; }

function kreisTeams(meName){
  var t = null; TEAMS.forEach(function(x){ if (x.n===meName) t = x; });
  if (!t) return storyTeams();
  var mt = teamOf(t);
  var club = {n:t.n, nick:t.n.split(' ').pop(), pal:mt.pal, resin:mt.resin};
  var opps = TEAMS.filter(function(x){ return x.n!==meName; }).map(teamOf);

function ownTeams(o){
  var club = {n:o.name, nick:o.name.split(' ').pop(), pal:o.pal, resin:o.resin}, names = [], used = {};
  o.names.forEach(function(n){ if (n && !used[n.toLowerCase()] && n.toLowerCase()!==o.name.toLowerCase() && names.length<o.n-1){ used[n.toLowerCase()] = 1; names.push(n); } });
  var places = shuffle(GEN_PLACE.slice());
  while (names.length<o.n-1){
    var nm = pick(GEN_PRE)+' '+(places.length?places.pop():'Ort '+ri(10,99));
    if (!used[nm.toLowerCase()]){ used[nm.toLowerCase()] = 1; names.push(nm); }

  return {club:club, teams:teams};
}

function mkSched(n){
  var ids = [], i, k, r; for (i=0;i<n;i++) ids.push(i); if (n%2) ids.push(-1);
  var m = ids.length, rounds = [];
  for (r=0;r<m-1;r++){
    var rd = [];
    for (k=0;k<m/2;k++){ var a = ids[k], b = ids[m-1-k]; if (a>=0 && b>=0) rd.push(r%2 ? [b,a] : [a,b]); }
    rounds.push(rd); ids.splice(1,0,ids.pop());
  }
  var second = rounds.map(function(rd){ return rd.map(function(p){ return [p[1],p[0]]; }); });
  return rounds.concat(second);
}
function freshMe(){ return {g:0,sh:0,ast:0,sv:0,cn:0,rt:0,rn:0,mvp:0,w:0,d:0,l:0,games:0,pos:{}}; }
function newSeason(mode, built){

}
function sortedIdx(){
  var s = P.season, idx = s.teams.map(function(t,i){ return i; });
  idx.sort(function(a,b){ var x = s.teams[a], y = s.teams[b];
    return (y.pts-x.pts) || ((y.gf-y.ga)-(x.gf-x.ga)) || (y.gf-x.gf) || (x.n<y.n?-1:1); });
  return idx;
}
function rankOf(i){ return sortedIdx().indexOf(i)+1; }
function gauss(){ return (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.7; }
function recGame(t, gf, ga){
  t.pl++; t.gf += gf; t.ga += ga;
  if (gf>ga){ t.w++; t.pts += 2; } else if (gf===ga){ t.d++; t.pts += 1; } else t.l++;
}
function myFixture(){
  var s = P.season; if (!s || s.round>=s.sched.length) return null;
  var rd = s.sched[s.round];
  for (var i=0;i<rd.length;i++) if (rd[i][0]===0 || rd[i][1]===0) return {opp: rd[i][0]===0 ? rd[i][1] : rd[i][0], home: rd[i][0]===0};
  return {bye:true};
}
function simRound(res){
  var s = P.season, rd = s.sched[s.round];
  rd.forEach(function(p){
    var h = p[0], a = p[1], gh, ga;
    if (res && (h===0 || a===0)){ gh = h===0 ? res.mine : res.opp; ga = h===0 ? res.opp : res.mine; }
    else {
      var bh = s.teams[h].base, ba = s.teams[a].base;
      gh = Math.round(clamp(27.5+(bh-ba)*.3+1.2+gauss()*1.9,16,42));
      ga = Math.round(clamp(26.5-(bh-ba)*.3+gauss()*1.9,16,42));
    }
    recGame(s.teams[h], gh, ga); recGame(s.teams[a], ga, gh);
  });
  s.round++;
}
function skipByes(){
  var s = P.season; if (!s) return;

  return {id:'kurz', t:'Kurzurlaub', s:'Ein verlängertes Wochenende lockt: Ein Freund bietet dir eine Hütte an.',
    opts:[evOpt('go','Wegfahren','Das Training fällt aus, der Trainer ist nicht begeistert.'),evOpt('stay','Lieber hierbleiben','Du bleibst im Rhythmus.')],
    pick:function(id){ if (id==='go'){ S.trainStep = 2; S.coachD -= 1; return {t:'Kurzurlaub in der Hütte: Kamin, Karten und viel Ruhe. Das Training lässt du ausfallen.', c:chipsOf({morale:10,energy:8})}; }
      S.coachD += .5; return {t:'Du bleibst im Rhythmus. Der Trainer bemerkt es.'}; }};
}
function evSponsor(){
  return {id:'sponsor', t:'Sponsoring', s:'Ein Autohaus aus der Nachbarschaft möchte den Verein unterstützen.',
    opts:[evOpt('shirt','Trikotwerbung','150 Euro für die Mannschaftskasse, dafür Fototermin.'),evOpt('band','Bandenwerbung','80 Euro, wenig Aufwand.'),evOpt('no','Ablehnen','Der Verein bleibt unabhängig.')],
    pick:function(id){ if (id==='shirt'){ P.kasse += 150; return {t:'Das Autohaus bekommt ein Logo auf der Brust. 150 Euro landen in der Mannschaftskasse.', c:chipsOf({morale:2})}; }
      if (id==='band'){ P.kasse += 80; return {t:'Die Bande ist beschriftet. 80 Euro in die Kasse.'}; } return {t:'Du lehnst höflich ab. Der Vorstand zuckt mit den Schultern.'}; }};
}
function evGeld(){
  var amt = ri(8,30)*10;
  return {id:'geld', t:'Geldsegen', s:'Der Verein bekommt eine Spende: '+amt+' Euro für die Mannschaft. Was passiert damit?',
    opts:[evOpt('kasse','In die Kasse','Rücklagen sind nie verkehrt.'),evOpt('abend','Teamabend','Pizza und Spieleabend für alle.'),evOpt('balls','Neue Bälle','Der Ballsack bekommt Zuwachs.')],
    pick:function(id){ if (id==='kasse'){ P.kasse += amt; return {t:amt+' Euro wandern in die Mannschaftskasse.'}; }
      if (id==='abend'){ return {t:'Teamabend mit Pizza und Spielen. Die Stimmung ist bestens.', c:chipsOf({morale:10})}; }
      P.buff = {n:4,stam:0,shoot:1,cb:0}; return {t:'Neue Bälle für alle. Das Wurfgefühl ist gleich besser.', c:chipsOf({focus:3})}; }};
}

function buildEvents(){
  var s = P.season, q = [], f = S.fixture; if (!s || !f || S.coach) return q;
  var add = function(e){ if (e) q.push(e); };
  if (!P.inj && chance(.05)) P.inj = {id:'cold', n:'Erkältung', left:ri(1,2)};
  if (P.inj && P.inj.left>0) add(evInjury());
  if (s.round===0){ if (pa().length<2) add(evAmts()); if (s.posLocked && chance(.3)) add(evPosOffer()); }
  if (s.lastWin){ s.lastWin = false; add(evKick()); }
  if (s.round%7===3) add(evKg());
  if (s.round===Math.floor(s.sched.length/2)) add(evTurnier(0,0));
  else if (chance(.09) && !(P.inj && P.inj.left>0)) add(evKurz());
  if (chance(.1)) add(evSponsor());
  else if (chance(.05)) add(evGeld());
  return q;
}
function vEvent(){
  var ev = S.evQ[0];
  if (S.evRes){
    return '<section class="card"><h2>'+esc(ev.t)+'</h2><p>'+esc(S.evRes.t)+'</p>'+(S.evRes.c||'')+'<button class="btn" data-a="evnext">Weiter</button></section>';
  }
  return '<section class="card"><h2>'+esc(ev.t)+'</h2><p class="lead">'+esc(ev.s)+'</p><div class="opts">'
    + ev.opts.map(function(o){ return '<button class="opt" data-a="evp" data-v="'+o.id+'"><b>'+esc(o.t)+'</b>'+(o.s?'<span>'+esc(o.s)+'</span>':'')+'</button>'; }).join('')+'</div></section>';
}
A.evp = function(el){ var ev = S.evQ[0]; if (!ev || S.evRes) return; S.evRes = ev.pick(el.dataset.v) || {t:''}; saveP(); render(); };
A.evnext = function(){
  var r = S.evRes; S.evQ.shift(); S.evRes = null;
  if (r && r.next) S.evQ.unshift(r.next);
  render();
};
var _vWeek1 = V.week;
V.week = function(){
  if (!S.evQ) S.evQ = buildEvents();
  if (S.evQ.length) return vEvent();
  var h = _vWeek1();
  var info = '<p class="small">Mannschaftskasse: '+P.kasse+' Euro'+(P.inj?' · '+esc(P.inj.n)+' ('+P.inj.left+' Spiel'+(P.inj.left>1?'e':'')+')':'')+(pa().length?' · Ämter: '+pa().map(function(id){ return amtOf(id).n; }).join(', '):'')+'</p>';
  return h.replace('<div class="tiles">', info+'<div class="tiles">');
};

/* ---------- Verdrahtung in newRun, Start, Abschluss ---------- */
var _newRun2 = newRun;
newRun = function(){
  var r = _newRun2(), s = P.season;
  r.evQ = null; r.evRes = null; r.winBeer = false; r.newInj = null; r.injOut = false; r.coach = false; r.healMsg = '';
  if (s && !s.done && r.season){
    if (s.coach){ r.coach = true; r.canPlay = false; r.cap = true; r.evQ = []; }
    else if (P.inj && P.inj.left>0){ r.canPlay = false; r.injOut = true; }
    if (P.buff && P.buff.n>0 && !r.coach){ r.tr.stam += P.buff.stam||0; r.tr.shoot += P.buff.shoot||0; r.tr.cb += P.buff.cb||0; }
    if (P.adapt>0 && !r.coach){ r.tr.shoot -= 3; r.tr.keep -= 2; }
  }
  return r;
};
var _start2 = A.start;
A.start = function(){ if (P.season && !P.season.coach) P.season.posLocked = true; return _start2.apply(this, arguments); };
var _vSetup2 = V.setup;
V.setup = function(){
  var h = _vSetup2();
  if (P.season && P.season.posLocked && !P.season.coach){
    h = h.replace(/<button class="pill" data-a="pos"/g, '<button disabled class="pill" data-a="pos"');
    h = h.replace('<p class="tip">', '<p class="tip">Der Trainer legt deine Position fest. Ein Wechsel kommt nur auf seinen Vorschlag. ');
  }
  return h;
};
var _fr2 = finishRun;
finishRun = function(){
  if (S.saved) return;
  _fr2();
  var s = P.season; if (!s) return;
  var R = S.result;
  if (S.season){
    if (R.res==='win') s.lastWin = true;
    if (S.winBeer && R.res==='win'){ S.vb += 100; if (S.saved) S.saved.beer = true; }
    if (!S.coach){
      if (R.inj && !P.inj){ var I = newInjury(); S.newInj = I; }
      else if (P.inj){ P.inj.left--; if (P.inj.left<=0){ S.healMsg = 'Du bist wieder fit: '+P.inj.n+' ist auskuriert.'; P.inj = null; } }
      if (P.buff){ P.buff.n--; if (P.buff.n<=0) P.buff = null; }
      if (P.adapt>0 && S.canPlay) P.adapt--;
    }
    if (S.coach && S.saved){ S.saved.comment = 'Der Vlog zeigt dich an der Seitenlinie. Die Fans kommentieren jede Auszeit.'; }
    if (S.newAchExtra && S.saved) S.saved.newAch = (S.saved.newAch||[]).concat(S.newAchExtra);
    saveP();
  }
};
var _vStats2 = V.stats;
V.stats = function(){
  var h = _vStats2();
  var note = '';
  if (S.newInj) note += '<p class="note">Verletzung: '+esc(S.newInj.n)+'. Noch '+S.newInj.left+' Spiel'+(S.newInj.left>1?'e':'')+' Pause.</p>';
  if (S.healMsg) note += '<p class="note">'+esc(S.healMsg)+'</p>';
  if (S.coach) h = h.replace('Heute nur auf der Tribüne.', 'Heute an der Seitenlinie.');
  else if (S.injOut && !S.canPlay) h = h.replace('Heute nur auf der Tribüne.', 'Verletzt: Heute nur auf der Tribüne.');
  if (!note) return h;
  return h.replace('<button class="btn ghost" data-a="table">', note+'<button class="btn ghost" data-a="table">').replace(/(<button class="btn" data-a="again">)/, function(m){ return h.indexOf(note)>=0 ? m : note+m; });
};

/* ---------- Erfolge ---------- */
ACH.push(
  {id:'xmas', n:'Weihnachtsturnier-Sieger', d:'Das Weihnachtsturnier gewonnen.', hid:0},
  {id:'mtrainer', n:'Meistertrainer', d:'Als Trainer eine Saison auf Platz 1 beendet.', hid:0}
);

/* ---------- Trainerkarriere ab Saison 5 ---------- */
var _vSE2 = V.seasonend;
V.seasonend = function(){
  var h = _vSE2(), s = P.season;
  if (s && s.num>=5 && !s.coach){
    h = h.replace('<button class="btn" data-a="nextseason">Neue Saison starten</button>',
      '<button class="btn" data-a="nextseason">Als Spieler weiterspielen</button><button class="btn ghost" data-a="coachstart">Trainerkarriere starten</button><p class="small">Als Trainer spielst du nicht selbst, sondern leitest die Mannschaft: Training, Halbzeitansprache, Auszeiten und Abwehrumstellungen.</p>');
  }
  return h;
};
A.coachstart = function(){ P.season.coach = true; saveP(); A.nextseason(); };
var _sf2 = seasonFinish;
seasonFinish = function(){
  _sf2();
  var s = P.season;
  if (s.coach && rankOf(0)===1 && !P.ach.mtrainer){ P.ach.mtrainer = 1; if (s.last) s.last.got.push('mtrainer'); saveP(); }
};
var _weekgo2 = A.weekgo;
A.weekgo = function(){
  if (P.season && P.season.coach){
    S.canPlay = false; S.coach = true; S.cap = true;
    S.homeBase += (S.tr.shoot+S.tr.keep)*.12+S.tr.stam*.06;
    S.eveOpts = null; go('match'); return;
  }
  return _weekgo2.apply(this, arguments);
};
var _mk2 = mkSim;
mkSim = function(inter){
  var sm = _mk2(inter);
  if (S.coach){ sm.pre = [{m:0,t:'Anpfiff. Du stehst als Trainer an der Seitenlinie.',k:'info'}]; sm.role = 'all'; }
  return sm;
};
var _vMatch2 = V.match;
V.match = function(){
  var M = S.match, sm = M.sm;
  if (S.coach && M.state==='ready'){
    return '<section class="card"><h2>Anpfiff</h2><div class="board"><div class="tm">'+tmName(CLUB().n)+'</div><div class="sc"><span>0</span>:<span>0</span></div><div class="tm">'+tmName(S.opp)+'</div></div>'+oppCard()
      +'<p>Du stehst als Trainer an der Seitenlinie. Mit Auszeiten, Abwehrumstellungen und der Halbzeitansprache lenkst du das Spiel.</p>'
      +'<button class="btn" data-a="kick" data-v="crunch">Spiel leiten</button><button class="btn ghost" data-a="kick" data-v="sim">Nur simulieren</button></section>';
  }
  var h = _vMatch2();
  if (S.coach && sm && M.mode==='crunch' && M.state==='run' && !sm.pend && h.indexOf('id="toBtn"')>=0){
    var ok = sm.min-sm.lastForm>=6 && sm.min<60;
    h = h.replace(/(<button class="btn" id="toBtn"[^>]*>[^<]*<\/button>)/, '$1<button class="btn" id="fmBtn" data-a="formgo"'+(ok?'':' disabled')+'>Abwehr umstellen</button>');
  }
  return h;
};
V.match = V.match;
A.formgo = function(){
  var M = S.match, sm = M.sm; if (!sm || M.state!=='run' || sm.min-sm.lastForm<6) return;
  clearInterval(tick); sm.pend = {type:'form'}; M.state = 'pause'; render();
};
var _updTO2 = updTO;
updTO = function(){
  _updTO2();
  var b = document.getElementById('fmBtn'); if (b && S.match && S.match.sm) b.disabled = !(S.match.sm.min-S.match.sm.lastForm>=6 && S.match.sm.min<60);
};
/* Halbzeit für den Trainer */
var COACH_HALF = [
  {id:'c_fehler', t:'Fehler ansprechen', fn:function(sm){ sm.homeBase += .5; return {t:'Du sprichst die Fehler an, ruhig und konkret. Die Mannschaft nickt.', c:halfApply(sm,{focus:3,morale:-1})}; }},
  {id:'c_lob', t:'Die gute Arbeit loben', fn:function(sm){ sm.homeBase += .3; return {t:'Du lobst, was gut läuft. Die Brust wird breiter.', c:halfApply(sm,{morale:5})}; }},
  {id:'c_abw', t:'Abwehr neu einstellen', fn:function(sm){ sm.homeBase += .6; return {t:'Du stellst die Abwehr neu ein und erklärst die Laufwege.', c:halfApply(sm,{focus:2})}; }},
  {id:'c_ruhe', t:'Ruhe bewahren', fn:function(sm){ sm.homeBase += .3; return {t:'Du bleibst ruhig. Die Mannschaft folgt deinem Ton.', c:halfApply(sm,{focus:3,morale:2})}; }},
  {id:'c_feuer', t:'Feuer entfachen', fn:function(sm){ sm.homeBase += .4; return {t:'Du wirst laut, die Kabine wird lauter.', c:halfApply(sm,{morale:6,focus:-2})}; }},
  {id:'c_tempo', t:'Mehr Tempo fordern', fn:function(sm){ sm.homeBase += .5; return {t:'Du forderst mehr Tempo im Umschaltspiel. Die Außen nicken.', c:halfApply(sm,{energy:-2,focus:2})}; }},
  {id:'c_ziel', t:'Das Spiel in 30 Minuten drehen', fn:function(sm){ sm.homeBase += sm.hs<sm.as?.8:.3; return {t:'Du gibst das Ziel aus: 30 Minuten Vollgas. Die Mannschaft glaubt daran.', c:halfApply(sm,{morale:5})}; }}
];
var _halfFind2 = halfFind;
halfFind = function(id){ for (var i=0;i<COACH_HALF.length;i++) if (COACH_HALF[i].id===id) return COACH_HALF[i]; return _halfFind2(id); };
var _makeHalf2 = makeHalf;
makeHalf = function(sm){
  if (S.coach) return {stage:'locker', little:false, opts:pick3(COACH_HALF,'halfc').map(function(e){ return e.id; }), res:null};
  return _makeHalf2(sm);
};
var _step3 = step;
step = function(){
  var M = S.match;
  if (S.coach && M && M.mode==='crunch' && M.state==='run'){
    var sm = M.sm;
    if (sm.inter && sm.min===30 && !sm.halfDone){
      sm.halfDone = true; S.half = makeHalf(sm); sm.pend = {type:'half'};
      M.i = sm.min; clearInterval(tick); M.state = 'pause'; render(); return;
    }
  }
  return _step3();
};


S = newRun();
render();
</script>
